[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
; Allow connections from host nginx (comment out to allow all, or specify Docker network IPs)
; listen.allowed_clients = 127.0.0.1
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Increase request timeout to match PHP max_execution_time
request_terminate_timeout = 600s


