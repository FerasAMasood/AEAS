# HTTP Only - For initial certificate generation
# This config allows Let's Encrypt validation without requiring SSL
server {
    listen 80;
    server_name aeas.work.gd www.aeas.work.gd;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
        allow all;
    }
    
    # Increase client timeouts
    client_body_timeout 6000;
    client_header_timeout 6000;
    send_timeout 6000;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Increase FastCGI timeouts
        fastcgi_read_timeout 6000;
        fastcgi_send_timeout 6000;
        fastcgi_connect_timeout 6000;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ /\.ht {
        deny all;
    }
}

